name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.2"
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.1"
      - run: rustup toolchain install 1.93.1 --profile minimal
      - run: rustup default 1.93.1
      - run: uv sync --frozen --all-extras --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run --frozen --all-extras pytest -q
      - name: Check dashboard data handling
        run: node --test tests/web/dashboard.test.cjs
      - name: Calibrate the full corpus and compare its saved baseline
        run: |
          uv run review-boundary demo --split all --mode reference --output runs/ci-reference
          uv run review-boundary compare examples/baselines/reference-v02.json runs/ci-reference/report.json

  reusable-calibration:
    uses: ./.github/workflows/evaluate.yml
    with:
      mode: calibration
      artifact_name: reusable-calibration

  reusable-preview:
    needs: reusable-calibration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.10.2"
          python-version: "3.11"
      - run: uv sync --frozen
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.reusable-calibration.outputs.artifact_id }}
          merge-multiple: true
          path: runs/reusable-result
      - name: Preview the downloaded result without an App credential
        env:
          EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          uv run --frozen review-boundary github-preview \
            --repository utkutugrul/review-boundary --pull-number 1 --app-id 1 \
            --expected-head "$EVALUATED_SHA" --comparison runs/reusable-result/comparison.json \
            --output runs/pr-comment.md
