name: Model regression

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider whose API key and pricing should be used
        required: true
        default: openrouter
        type: choice
        options: [openrouter, openai, anthropic]
      model:
        description: Provider-native model ID
        required: true
        default: openai/gpt-6-luna
        type: string
      pricing_file:
        description: Dated quote JSON path in this repo, required for direct providers
        required: false
        type: string
      budget:
        description: Conservative USD reservation limit for this run
        default: "7"
        type: string
      defense:
        description: Candidate reviewer prompt
        required: true
        default: baseline
        type: choice
        options: [baseline, explicit]

permissions:
  contents: read

jobs:
  evaluate:
    uses: ./.github/workflows/evaluate.yml
    with:
      mode: model
      provider: ${{ inputs.provider }}
      model: ${{ inputs.model }}
      defense: ${{ inputs.defense }}
      baseline: examples/pilot-v2-typescript/report.json
      baseline_source: caller
      baseline_model: openrouter/openai/gpt-6-luna
      baseline_defense: baseline
      pricing_file: ${{ inputs.pricing_file }}
      budget: ${{ fromJSON(inputs.budget) }}
      artifact_name: model-regression-results
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
