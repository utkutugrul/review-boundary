[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "review-boundary"
version = "0.3.0"
description = "Paired behavioral evaluations of prompt injection in AI security reviews"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Utku Tugrul"}]
dependencies = [
    "anthropic>=2.6.0",
    "inspect-ai>=0.3.287,<0.4",
    "openai",
    "pydantic>=2,<3",
    "python-dotenv",
]

[project.urls]
Repository = "https://github.com/utkutugrul/review-boundary"
Issues = "https://github.com/utkutugrul/review-boundary/issues"

[project.scripts]
review-boundary = "review_boundary.cli:main"

[project.optional-dependencies]
upstream = [
    "cryptography==50.0.2",
]
mcp = [
    "mcp>=1.30,<2",
]
github = [
    "pyjwt[crypto]>=2.10,<3",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/review_boundary"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/dist",
    "/dist-check",
    "/logs",
    "/reports",
    "/runs",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

